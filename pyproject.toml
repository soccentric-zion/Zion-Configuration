[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "low-impact-web"
version = "1.0.0"
description = "Production-grade web dashboard for an ARM embedded Linux device"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools]
packages = ["app"]

# --- Ruff: lint + format ---------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["static/vendor", ".venv"]

[tool.ruff.lint]
# A pragmatic, readable rule set: pyflakes, pycodestyle, isort, bugbear,
# comprehensions, pyupgrade. Easy to extend by adding codes here.
select = ["E", "F", "I", "B", "C4", "UP", "W"]
ignore = [
    "B008",  # FastAPI uses function calls (Depends/Query) in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]  # tests intentionally assert on broad exceptions

# --- Mypy: strict static typing -------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
# The HAL registry is a dynamic ``dict[str, Any]`` keyed by module name, so the
# thin router handlers legitimately return ``Any`` from ``get_hal(...).method()``.
# Everything else stays strict.
warn_return_any = false
exclude = ['^static/', '^deploy/']

[[tool.mypy.overrides]]
# Third-party packages that ship no type stubs.
module = ["uvicorn.*", "aiosqlite.*", "bcrypt.*", "jwt.*", "psutil.*"]
ignore_missing_imports = true

# --- Pytest ----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = "-q"

# --- Coverage --------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
