[package]
name = "webconfigd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "On-device WebConfig daemon: TLS HTTP layer over the config engine (single non-root daemon, tokio current_thread)."

[[bin]]
name = "webconfigd"
path = "src/main.rs"

[dependencies]
webconfig-engine = { path = "../webconfig-engine" }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tower-sessions = { workspace = true, features = ["memory-store"] }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rcgen = { workspace = true }
tokio-rustls = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
zbus = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
# MCU firmware signature verification (Ed25519, spec §4.9). Already vendored
# via webconfig-engine's AEAD use (backup.rs) — no new crate in the graph.
ring = { version = "0.17", default-features = false }
sha2 = { workspace = true }
rusqlite = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
# test-util (paused/virtual clock for the SSE test) is dev-only — the union
# of features across [dependencies]/[dev-dependencies] only actually compiles
# in for test builds, never the release binary (spec §2 size budget).
tokio = { workspace = true, features = ["test-util"] }